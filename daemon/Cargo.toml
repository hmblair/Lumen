[package]
name = "lumen-daemon"
version = "0.1.0"
edition = "2021"
description = "Provider-translation daemon for Lumen: serves a normalized lights API, speaks Philips Hue to the bridge"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
axum = "0.8"
# rustls instead of the platform TLS stack: pure Rust, no system libraries,
# and it offers the accept-invalid-certs switch the self-signed bridge needs.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
# NOAA sunrise/sunset math for solar schedules ("at": "sunset").
sunrise = "3"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
